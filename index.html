<script data-page-node-id="mMPYNvjtqjCouTrX4YszJR" data-pnid-children="TX5MFABZGHcn9ulJfmREC8">
(function(){
  "use strict";
  const GRID = 17;                 // 格子数更少 → 每格更大，蛇和豆豆都更醒目
  const BASE = 34;                 // 逻辑像素/格
  const FOOD_TARGET = 10;          // 场上同时存在的能量球数量（豆豆更多）
  const LOGICAL = GRID * BASE;
  const EAT_MS = 520;              // 吃到豆豆后"吧唧嘴"表情持续时长
  // 贪吃喵主题：白色 / 浅粉 / 浅蓝 三只 Kitty
  // a/b=身体渐变色  line=描边  ink=五官  ear/inner=耳朵  whk=胡须色  bow=蝴蝶结
  const CATS = [
    { name:'香芋 Kitty', tag:'💜', kind:'kitty',
      a:'#f1e7fb', b:'#dcc3f2', line:'#b795d8', ink:'#3a2b46',
      ear:'#f1e7fb', inner:'#e6d4f7', nose:'#ffb0c8', bow:'#c47fdd', gingham:true,
      whk:'#9a6fc0', blush:'rgba(190,140,225,.42)', tail:'ribbon' },
    { name:'樱花 Kitty', tag:'🌸', kind:'kitty',
      a:'#ffe7f0', b:'#ffc9de', line:'#eda0c0', ink:'#4a2b38',
      ear:'#ffe7f0', inner:'#ffd4e6', nose:'#ff8fb4', bow:'#ff6ba2',
      whk:'#e26a97', blush:'rgba(255,120,175,.42)', tail:'ribbon' },
    { name:'奶蓝 Kitty', tag:'💙', kind:'kitty',
      a:'#dff0fc', b:'#b3dcf5', line:'#7fb8de', ink:'#2b3a46',
      ear:'#dff0fc', inner:'#c8e7fa', nose:'#ffb0c8', bow:'#5fa8e0',
      whk:'#5d92ba', blush:'rgba(140,195,235,.45)', tail:'ribbon' },
  ];
  const CAT_KEY = 'neonSnakeCat_v1';
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  // 关键：设置 canvas 内部分辨率并做 DPR 缩放，否则默认 300x150 会把蛇画到画布外
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = LOGICAL * DPR;
  canvas.height = LOGICAL * DPR;
  ctx.scale(DPR, DPR);

  // 高分本地存储
  const HS_KEY = 'neonSnakeHigh_v1';
  let highScore = parseInt(localStorage.getItem(HS_KEY) || '0', 10);

  // DOM
  const el = {
    score: document.getElementById('score'),
    high: document.getElementById('high'),
    level: document.getElementById('level'),
    len: document.getElementById('len'),
    overlay: document.getElementById('overlay'),
    ovTitle: document.getElementById('ovTitle'),
    ovText: document.getElementById('ovText'),
    startBtn: document.getElementById('startBtn'),
    pauseBtn: document.getElementById('pauseBtn'),
    restartBtn: document.getElementById('restartBtn'),
    themeBtn: document.getElementById('themeBtn'),
    soundBtn: document.getElementById('soundBtn'),
    badge: document.getElementById('badge'),
  };

  // ---- 首界面：挑一只猫猫 ----
  const picker = document.getElementById('picker');
  const pickerTitle = document.getElementById('pickerTitle');
  const catList = document.getElementById('catList');

  // 猫猫形态（记住上次选的那只）
  let catIndex = (()=>{
    const v = parseInt(localStorage.getItem(CAT_KEY) || '0', 10);
    return (v >= 0 && v < CATS.length) ? v : 0;
  })();
  let skin = CATS[catIndex];
  let eatT = 0;                    // 吃到豆豆后的表情倒计时

  // ---- 像素风 Kitty 头：块状脸 + 阶梯三角耳 + 像素胡须 + 像素蝴蝶结 ----
  // (cx,cy)=绘制原点  u=单格像素边长  opts:{eating, chomp}
  function drawPixelHead(g, cx, cy, u, sk, opts){
    opts = opts || {};
    const eating = !!opts.eating, chomp = opts.chomp || 0;
    const P = (gx,gy,w,h,c)=>{ g.fillStyle=c; g.fillRect(cx+gx*u, cy+gy*u, w*u, h*u); };
    const inHead = (gx,gy)=>{ const X=(gx+0.5)/9.6, Y=(gy+0.5)/7.7; return X*X+Y*Y<=1; };
    const earHW = gy => gy===-9?0.5 : gy===-8?2.5 : gy===-7?4.5 : -1;    // 耳朵每行半宽（中心在 ±4）
    const inEar = (gx,gy)=>{ const w=earHW(gy); if(w<0) return false; const ax=Math.abs(gx+0.5)-4; return ax>=-w && ax<=w; };
    const inShape = (gx,gy)=> inHead(gx,gy)||inEar(gx,gy);
    const solid = (gx,gy)=> inShape(gx-1,gy)&&inShape(gx+1,gy)&&inShape(gx,gy-1)&&inShape(gx,gy+1);
    const lite = mix(sk.a, '#ffffff', 0.18);

    // 第一遍：描边色打底；第二遍：内部填色（左上浅一档，避免一整块死实色）
    for(let gy=-11;gy<=9;gy++) for(let gx=-11;gx<=11;gx++){
      if(!inShape(gx,gy)) continue;
      P(gx,gy,1,1, solid(gx,gy) ? ((gx<=-2&&gy<=-1)?lite:sk.a) : sk.line);
    }
    // 内耳粉色（小一号的阶梯三角）
    for(let gy=-9;gy<=-7;gy++) for(let gx=-11;gx<=11;gx++){
      if(!inEar(gx,gy)) continue;
      const ax=Math.abs(gx+0.5)-4;
      if((gy===-9) || (gy===-8 && Math.abs(ax)<=1) || (gy===-7 && Math.abs(ax)<=2)) P(gx,gy,1,1,sk.inner);
    }

    // 眼睛：平时方块大眼带高光，吃到豆豆时变成 ^ ^ 开心眼
    if(eating && chomp > 0.5){
      P(-6,-1,1,1,sk.ink); P(-5,-2,1,1,sk.ink); P(-4,-1,1,1,sk.ink);
      P( 4,-1,1,1,sk.ink); P( 3,-2,1,1,sk.ink); P( 2,-1,1,1,sk.ink);
    } else {
      P(-6,-2,2,3,sk.ink); P(-6,-2,1,1,'#fff'); P(-5,0,1,1,'rgba(255,255,255,.55)');
      P( 3,-2,2,3,sk.ink); P( 3,-2,1,1,'#fff'); P( 4,0,1,1,'rgba(255,255,255,.55)');
    }

    // 鼻子；吃豆时张嘴吐舌
    P(-1,1,2,1,sk.nose);
    if(eating){ P(-1,2,2,2,'#8c2a52'); P(-1,3,2,1,'#ff7fb2'); }

    // 腮红
    P(-8,3,2,1,sk.blush); P(6,3,2,1,sk.blush);

    // 胡须：每边三根像素短线
    // 胡须：每边三根，根部埋进脸里（不再悬空分离）
    [-2,0,2].forEach(wy=>{ P(-11,wy,3,1,sk.whk); P(8,wy,3,1,sk.whk); });

    // 像素蝴蝶结（右耳上方）：两个结瓣 + 深色结心
    const knot = mix(sk.bow, '#000000', 0.25);
    const bowCells = [
      [7,-11],[11,-11],
      [6,-10],[7,-10],[10,-10],[11,-10],[12,-10],
      [6,-9],[7,-9],[10,-9],[11,-9],[12,-9],
      [7,-8],[11,-8],
    ];
    const knotCells = [[8,-10],[9,-10],[8,-9],[9,-9]];
    bowCells.forEach(b=>P(b[0],b[1],1,1,sk.bow));
    knotCells.forEach(b=>P(b[0],b[1],1,1,knot));
    if(sk.gingham){   // 经典款：格纹蝴蝶结
      bowCells.concat(knotCells).forEach(b=>{ if((b[0]+b[1])%2===0) P(b[0],b[1],1,1,'rgba(255,255,255,.5)'); });
    }
  }

  function drawCatPick(cv, sk){
    const size = 52, dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = size*dpr; cv.height = size*dpr;
    const g = cv.getContext('2d');
    g.setTransform(dpr,0,0,dpr,0,0);
    g.clearRect(0,0,size,size);
    const u = 1.9;                               // 和游戏里同一套像素头，所见即所得
    drawPixelHead(g, size*0.5, size*0.5 + u*0.5, u, sk, {});
  }

  function renderCatPicker(){
    catList.innerHTML = '';
    CATS.forEach((sk, i)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cat-opt' + (i === catIndex ? ' on' : '');
      const cv = document.createElement('canvas');
      const label = document.createElement('b');
      label.textContent = sk.tag + ' ' + sk.name;
      b.appendChild(cv); b.appendChild(label);
      b.addEventListener('click', ()=> selectCat(i));
      catList.appendChild(b);
      drawCatPick(cv, sk);
    });
    pickerTitle.textContent = '当前：' + CATS[catIndex].name;
  }

  function selectCat(i){
    catIndex = i; skin = CATS[i];
    try{ localStorage.setItem(CAT_KEY, String(i)); }catch(e){}
    renderCatPicker();
    draw();
  }

  // 状态
  let state = 'menu'; // menu | playing | paused | over
  let snake, dir, dirQueue, foods, powerup, obstacles, powerTimer;
  let score, level, foodsEaten, multiplier, moveInterval, acc, lastTime;
  let invincibleT, speedT, doubleT;       // 各效果剩余时间(ms)
  let particles = [];
  let soundOn = true;

  // 音效（WebAudio，无需外部文件）
  let audioCtx = null;
  function beep(freq, dur, type, vol){
    if(!soundOn) return;
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type||'sine'; o.frequency.value = freq;
      g.gain.value = vol||0.06;
      o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      o.start(t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur||0.12));
      o.stop(t + (dur||0.12));
    }catch(e){}
  }
  const sfx = {
    eat:   ()=>beep(660,0.10,'triangle',0.07),
    gold:  ()=>{beep(880,0.09,'square',0.06); setTimeout(()=>beep(1320,0.10,'square',0.05),70);},
    power: ()=>{beep(520,0.10,'sawtooth',0.05); setTimeout(()=>beep(780,0.12,'sawtooth',0.05),60);},
    level: ()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'triangle',0.06),i*80));},
    crash: ()=>{beep(180,0.25,'sawtooth',0.09); setTimeout(()=>beep(90,0.3,'sawtooth',0.08),120);},
  };

  // 工具
  const cellId = (x,y)=> y*GRID + x;
  const randEmpty = ()=>{
    const occ = new Set();
    snake.forEach(s=>occ.add(cellId(s.x,s.y)));
    foods.forEach(f=>occ.add(cellId(f.x,f.y)));
    if(powerup) occ.add(cellId(powerup.x,powerup.y));
    obstacles.forEach(o=>occ.add(cellId(o.x,o.y)));
    let x,y,tries=0;
    do{ x=(Math.random()*GRID)|0; y=(Math.random()*GRID)|0; tries++; }
    while(occ.has(cellId(x,y)) && tries<500);
    return {x,y};
  };

  function spawnFood(){
    const f = randEmpty();
    f.gold = Math.random() < 0.18;
    foods.push(f);
  }
  function ensureFoods(){ while(foods.length < FOOD_TARGET) spawnFood(); }
  function maybeSpawnPowerup(){
    if(powerup) return;
    const p = randEmpty();
    const types = ['speed','shield','double'];
    p.type = types[(Math.random()*types.length)|0];
    p.life = 9000;
    powerup = p;
  }

  function reset(){
    snake = [{x:8,y:8},{x:7,y:8},{x:6,y:8}];
    dir = {x:1,y:0}; dirQueue = [];
    obstacles = [];
    score = 0; level = 1; foodsEaten = 0; multiplier = 1;
    moveInterval = 270; acc = 0; powerTimer = 0;
    invincibleT = speedT = doubleT = 0; eatT = 0;
    particles = [];
    foods = []; powerup = null; ensureFoods();
    updateHUD();
  }

  function updateHUD(){
    el.score.textContent = score;
    el.high.textContent = highScore;
    el.level.textContent = level;
    el.len.textContent = snake.length;
  }

  function showBadge(text){
    el.badge.textContent = text;
    el.badge.classList.add('show');
    clearTimeout(el.badge._t);
    el.badge._t = setTimeout(()=>el.badge.classList.remove('show'), 1100);
  }
  function popScore(x,y,val,color){
    const d = document.createElement('div');
    d.className='score-pop'; d.textContent='+'+val;
    d.style.color = color; d.style.left = (x/GRID*100)+'%'; d.style.top = (y/GRID*100)+'%';
    canvas.parentElement.appendChild(d);
    setTimeout(()=>d.remove(), 800);
  }

  // 粒子
  function burst(x,y,color,n,spd){
    const cx = (x+0.5)*BASE, cy=(y+0.5)*BASE;
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = (Math.random()*spd)+1.5;
      particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color});
    }
  }
  function updateParticles(dt){
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i];
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94; p.life-=dt/600;
      if(p.life<=0) particles.splice(i,1);
    }
  }

  function levelUp(){
    level++; foodsEaten=0;
    moveInterval = Math.max(120, moveInterval*0.96);
    // 新增障碍（避开蛇与食物附近）
    if(level>=2){
      const o = randEmpty(); obstacles.push(o);
      burst(o.x,o.y,'#ff4d6d',10,2.5);
    }
    sfx.level(); showBadge('关卡 '+level+' ⚡');
  }

  function step(){
    if(dirQueue.length) dir = dirQueue.shift();
    let nx = snake[0].x + dir.x;
    let ny = snake[0].y + dir.y;
    const inv = invincibleT>0;
    if(nx<0||nx>=GRID||ny<0||ny>=GRID){
      if(inv){ nx=(nx+GRID)%GRID; ny=(ny+GRID)%GRID; }
      else { return gameOver(); }
    }
    const head = {x:nx,y:ny};
    const eatIdx = foods.findIndex(f=>f.x===head.x && f.y===head.y);
    const willGrow = eatIdx>=0;
    const body = inv ? snake : snake.slice(0, willGrow?snake.length:snake.length-1);
    if(body.some(s=>s.x===head.x&&s.y===head.y)){
      if(inv){ /* 无敌穿透 */ }
      else { return gameOver(); }
    }

    snake.unshift(head);
    if(willGrow){
      const f = foods[eatIdx];
      const gain = f.gold ? 30 : 10;
      const add = gain*multiplier;
      score += add;
      if(score>highScore){ highScore=score; localStorage.setItem(HS_KEY,String(highScore)); }
      popScore(f.x,f.y,add, f.gold?'#ffd23d':'#ff7ab3');
      burst(f.x,f.y, f.gold?'#ffd23d':'#ff7ab3', f.gold?18:10, 3);
      f.gold ? sfx.gold() : sfx.eat();
      eatT = EAT_MS;                 // 触发"吧唧嘴"表情
      foods.splice(eatIdx,1);
      foodsEaten++;
      if(foodsEaten>=5) levelUp();
      ensureFoods();
    } else {
      snake.pop();
    }

    // 道具
    if(powerup && head.x===powerup.x && head.y===powerup.y){
      applyPower(powerup.type, head.x, head.y);
      powerup=null;
    }
    updateHUD();
  }

  function applyPower(type,x,y){
    if(type==='speed'){ speedT = 6000; showBadge('⚡ 加速！'); burst(x,y,'#37f0ff',16,3.5); }
    if(type==='shield'){ invincibleT = 2600; showBadge('🛡 护盾！'); burst(x,y,'#7cff5a',16,3.5); }
    if(type==='double'){ doubleT = 8000; multiplier = 2; showBadge('✨ 双倍积分！'); burst(x,y,'#ff3df0',16,3.5); }
    sfx.power();
  }

  function gameOver(){
    state='over';
    eatT = 0;
    if(score>highScore){ highScore=score; localStorage.setItem(HS_KEY,String(highScore)); }
    sfx.crash();
    burst(snake[0].x,snake[0].y,'#ff6f9e',26,4);
    el.ovTitle.textContent='游戏结束';
    el.ovText.innerHTML='本局得分 <b style="color:#ff5fa2">'+score+'</b> · 长度 '+snake.length+' · 关卡 '+level+
      (score>=highScore?'<br>🎉 新纪录！':'<br>历史最高 '+highScore);
    el.startBtn.textContent='再来一局';
    picker.classList.remove('hidden');
    el.overlay.classList.remove('hidden');
    updateHUD();
  }

  // 渲染
  function draw(){
    ctx.clearRect(0,0,LOGICAL,LOGICAL);
    // 背景网格
    ctx.lineWidth=1;
    ctx.strokeStyle = getCSS('--grid', 'rgba(255,150,200,.10)');
    for(let i=1;i<GRID;i++){
      const p=i*BASE;
      ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,LOGICAL); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(LOGICAL,p); ctx.stroke();
    }
    // 障碍
    obstacles.forEach(o=>{
      ctx.fillStyle='rgba(255,122,158,.85)';
      roundRect(o.x*BASE+3,o.y*BASE+3,BASE-6,BASE-6,10); ctx.fill();
      ctx.strokeStyle='rgba(255,122,158,.4)'; ctx.stroke();
    });
    // 食物（场上多颗）
    const t = performance.now()/300;
    foods.forEach(f=>{
      const cx=(f.x+0.5)*BASE, cy=(f.y+0.5)*BASE;
      const r = BASE*0.40 + Math.sin(t)*1.8;
      ctx.save();
      if(f.gold){
        ctx.shadowBlur=18; ctx.shadowColor='#ffd23d'; ctx.fillStyle='rgba(255,210,61,.92)';
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0; ctx.font=(BASE*0.56)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('⭐', cx, cy+1);
      } else {
        ctx.shadowBlur=18; ctx.shadowColor='#ff7ab3'; ctx.fillStyle='rgba(255,122,179,.92)';
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0; ctx.font=(BASE*0.56)+'px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('💗', cx, cy+1);
      }
      ctx.restore();
    });
    // 道具
    if(powerup){
      const cx=(powerup.x+0.5)*BASE, cy=(powerup.y+0.5)*BASE;
      const col = powerup.type==='speed'?'#c08bff':powerup.type==='shield'?'#ffb3d9':'#ff5fa2';
      ctx.save(); ctx.shadowBlur=16; ctx.shadowColor=col; ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(cx,cy,BASE*0.38,0,Math.PI*2); ctx.fill(); ctx.restore();
      ctx.fillStyle='#04101f'; ctx.font='bold '+(BASE*0.42)+'px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(powerup.type==='speed'?'⚡':powerup.type==='shield'?'🛡':'✨', cx, cy+1);
    }
    // ===== 一只连续圆润的小可爱（身体不再是方格）+ 专属尾巴 + 圆脸 =====
    const colA = skin.a, colB = skin.b;
    const total = snake.length;
    const hd = snake[0], tailCell = snake[total-1];
    const eating = eatT > 0;
    const chomp = eating ? Math.abs(Math.sin((1-eatT/EAT_MS)*Math.PI*3)) : 0;

    // 1) 身体：沿各节中心连成一条粗圆线，先描边再上色 → 看起来是一条，不是一格一格
    if(total > 1){
      const bodyPath = ()=>{
        ctx.beginPath();
        ctx.moveTo((hd.x+0.5)*BASE, (hd.y+0.5)*BASE);
        for(let i=1;i<total;i++) ctx.lineTo((snake[i].x+0.5)*BASE, (snake[i].y+0.5)*BASE);
      };
      const grad = ctx.createLinearGradient(
        (hd.x+0.5)*BASE,(hd.y+0.5)*BASE,
        (tailCell.x+0.5)*BASE,(tailCell.y+0.5)*BASE);
      grad.addColorStop(0, colA); grad.addColorStop(1, colB);

      ctx.save();
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = mix(colA,colB,0.55); ctx.shadowBlur = 12;
      ctx.strokeStyle = skin.line; ctx.lineWidth = BASE*0.87; bodyPath(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = grad;      ctx.lineWidth = BASE*0.83; bodyPath(); ctx.stroke();
      ctx.restore();
    }

    // 2) 尾巴：三种角色各有各的尾巴
    if(total > 2){
      const s = snake[total-1], p = snake[total-2];
      const tc = mix(colA,colB,0.9);
      ctx.save();
      ctx.translate((s.x+0.5)*BASE, (s.y+0.5)*BASE);
      ctx.rotate(Math.atan2(s.y-p.y, s.x-p.x));   // 尾巴朝着身后长出去
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.shadowColor = tc; ctx.shadowBlur = 8;
      if(skin.tail === 'pom'){
        // 米菲兔：一颗毛球尾巴——由一个个小圆堆出来的
        ctx.fillStyle = '#fff'; ctx.strokeStyle = skin.line; ctx.lineWidth = 1.4;
        [[0.30,-0.30,0.72],[0.48,0.00,1.00],[0.30,0.30,0.72],[0.76,0.00,0.56],[0.14,0.00,0.62]].forEach(b=>{
          ctx.beginPath(); ctx.arc(BASE*b[0], BASE*b[1], BASE*0.30*b[2], 0, Math.PI*2);
          ctx.fill(); ctx.stroke();
        });
      } else if(skin.tail === 'stub'){
        // 小羊：一小截上翘的短尾巴，尾尖一颗小绒球
        const t = ()=>{
          ctx.beginPath();
          ctx.moveTo(-BASE*0.06, BASE*0.06);
          ctx.quadraticCurveTo(BASE*0.30, BASE*0.04, BASE*0.34, -BASE*0.30);
        };
        ctx.strokeStyle = skin.line; ctx.lineWidth = BASE*0.30; t(); ctx.stroke();
        ctx.strokeStyle = tc;        ctx.lineWidth = BASE*0.23; t(); ctx.stroke();
        ctx.fillStyle = '#fffdf6';
        ctx.beginPath(); ctx.arc(BASE*0.34, -BASE*0.40, BASE*0.16, 0, Math.PI*2); ctx.fill();
      } else {
        // Kitty：轻盈柔滑的渐细尾巴（分段曲线，自然收窄）+ 尾尖轻摆动画 + 小巧圆爪
        // 注意：尾根要避开身体端盖（约 0.44*BASE），否则会盖出浅色鬼影
        const sway = Math.sin(performance.now()/300) * BASE*0.10;   // 尾尖轻轻摇
        const T = q => [
          BASE*0.34 + q*BASE*0.54,
          -Math.sin(q*Math.PI*0.9)*BASE*0.15 - q*q*BASE*0.10 + sway*q
        ];
        const drawTail = (pad, color)=>{
          const SEG = 8;
          ctx.strokeStyle = color; ctx.lineCap = 'round';
          for(let i=0;i<SEG;i++){
            const q0 = i/SEG, q1 = (i+1)/SEG;
            const a = T(q0), b = T(q1);
            ctx.lineWidth = BASE*(0.30 - 0.21*q1) + pad*2;
            ctx.beginPath(); ctx.moveTo(a[0], a[1]);
            ctx.quadraticCurveTo((a[0]+b[0])/2, (a[1]+b[1])/2, b[0], b[1]);
            ctx.stroke();
          }
        };
        drawTail(1.2, skin.line);
        drawTail(0, tc);

        // 小巧圆爪：跟着尾尖走的小圆爪，粉色肉垫 + 两个趾豆，比旧版小一圈更柔和
        const tip = T(1), px = tip[0] + BASE*0.10;
        const pawC = mix(tc, '#ffffff', 0.3);
        ctx.fillStyle = pawC; ctx.strokeStyle = skin.line; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(px, tip[1], BASE*0.14, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f0699e';
        ctx.beginPath(); ctx.ellipse(px, tip[1] + BASE*0.02, BASE*0.07, BASE*0.055, 0, 0, Math.PI*2); ctx.fill();
        [-1, 1].forEach(tx=>{
          ctx.beginPath(); ctx.arc(px + tx*BASE*0.06, tip[1] - BASE*0.07, BASE*0.028, 0, Math.PI*2); ctx.fill();
        });
      }
      ctx.restore();
    }

    // 3) 头：像素风 Kitty 脸（块状+阶梯耳+胡须），永远正对玩家
    {
      const u = BASE*0.072*(1 + 0.06*chomp);
      drawPixelHead(ctx, (hd.x+0.5)*BASE, (hd.y+0.5)*BASE + u*0.5, u, skin, { eating: eating, chomp: chomp });
    }

    // 无敌光环
    if(invincibleT>0){
      const s=snake[0]; const cx=(s.x+0.5)*BASE, cy=(s.y+0.5)*BASE;
      ctx.save(); ctx.strokeStyle='rgba(255,179,217,'+(0.4+0.4*Math.sin(performance.now()/120))+')';
      ctx.lineWidth=3; ctx.beginPath(); ctx.arc(cx,cy,BASE*0.7,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }
    // 粒子
    particles.forEach(p=>{
      ctx.globalAlpha=Math.max(0,p.life);
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.2*p.life+0.6,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;
  }

  function roundRect(x,y,w,h,r,g){
    g = g || ctx;
    g.beginPath();
    g.moveTo(x+r,y);
    g.arcTo(x+w,y,x+w,y+h,r);
    g.arcTo(x+w,y+h,x,y+h,r);
    g.arcTo(x,y+h,x,y,r);
    g.arcTo(x,y,x+w,y,r);
    g.closePath();
  }
  function getCSS(name,fallback){
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }
  function mix(c1,c2,t){
    const a=hex(c1), b=hex(c2);
    const r=Math.round(a[0]+(b[0]-a[0])*t), g=Math.round(a[1]+(b[1]-a[1])*t), bl=Math.round(a[2]+(b[2]-a[2])*t);
    return 'rgb('+r+','+g+','+bl+')';
  }
  function hex(c){
    c=c.replace('#',''); if(c.length===3) c=c.split('').map(x=>x+x).join('');
    return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
  }

  // 画一张脸（原点 = 脸中心，向上为 -y）。三种角色共用五官框架，耳朵/鼻子/花纹各具特色。
  function drawFace(g, r, sk, opts){
    opts = opts || {};
    const eating = !!opts.eating, chomp = opts.chomp || 0;
    const ink = sk.ink || '#2b1b24';
    const lw = Math.max(1.6, r*0.09);
    g.lineJoin = 'round'; g.lineCap = 'round';

    // ---- 耳朵 ----
    if(sk.kind === 'bunny'){
      // 米菲：两只直直立起的长耳朵
      [-1,1].forEach(sx=>{
        g.fillStyle = sk.ear; g.strokeStyle = sk.line; g.lineWidth = lw;
        g.beginPath(); g.ellipse(sx*r*0.34, -r*0.92, r*0.23, r*0.62, sx*0.10, 0, Math.PI*2);
        g.fill(); g.stroke();
        g.fillStyle = sk.inner;
        g.beginPath(); g.ellipse(sx*r*0.34, -r*0.92, r*0.10, r*0.40, sx*0.10, 0, Math.PI*2); g.fill();
      });
    } else if(sk.kind === 'sheep'){
      // 小羊：两只垂在两侧的小耳朵 + 头顶一撮羊毛
      [-1,1].forEach(sx=>{
        g.fillStyle = sk.ear; g.strokeStyle = sk.line; g.lineWidth = lw;
        g.beginPath(); g.ellipse(sx*r*0.94, r*0.12, r*0.28, r*0.19, sx*0.44, 0, Math.PI*2);
        g.fill(); g.stroke();
        g.fillStyle = sk.inner;
        g.beginPath(); g.ellipse(sx*r*0.96, r*0.12, r*0.13, r*0.08, sx*0.44, 0, Math.PI*2); g.fill();
      });
      g.fillStyle = '#fffdf7'; g.strokeStyle = sk.line; g.lineWidth = Math.max(1.2, r*0.07);
      [[-0.44,-0.76,0.30],[0.00,-0.92,0.34],[0.44,-0.76,0.30]].forEach(b=>{
        g.beginPath(); g.arc(b[0]*r, b[1]*r, b[2]*r, 0, Math.PI*2); g.fill(); g.stroke();
      });
    } else {
      // Hello Kitty：两只圆润的三角耳
      [-1,1].forEach(sx=>{
        g.fillStyle = sk.ear; g.strokeStyle = sk.line; g.lineWidth = lw;
        g.beginPath();
        g.moveTo(sx*r*0.84, -r*0.34);
        g.quadraticCurveTo(sx*r*1.00, -r*0.94, sx*r*0.50, -r*1.12);
        g.quadraticCurveTo(sx*r*0.18, -r*0.84, sx*r*0.12, -r*0.46);
        g.closePath(); g.fill(); g.stroke();
        g.fillStyle = sk.inner;
        g.beginPath();
        g.moveTo(sx*r*0.74, -r*0.44);
        g.quadraticCurveTo(sx*r*0.84, -r*0.84, sx*r*0.54, -r*0.96);
        g.quadraticCurveTo(sx*r*0.32, -r*0.78, sx*r*0.28, -r*0.54);
        g.closePath(); g.fill();
      });
    }

    // ---- Hello Kitty 的蝴蝶结 ----
    if(sk.kind === 'kitty'){
      g.save();
      g.translate(r*0.74, -r*0.94); g.rotate(0.30);
      g.fillStyle = sk.bow || sk.b;
      const bowLobe = (side)=>{                             // 画一侧结瓣
        g.beginPath(); g.moveTo(0,0);
        g.quadraticCurveTo(side*r*0.50,-r*0.34, side*r*0.34, r*0.08);
        g.quadraticCurveTo(side*r*0.18, r*0.34, 0, 0); g.closePath(); g.fill();
      };
      bowLobe(-1); bowLobe(1);
      if(sk.gingham){                                       // 经典款：粉白格子纹蝴蝶结
        g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = Math.max(1, r*0.05);
        g.beginPath();
        g.moveTo(-r*0.30, -r*0.16); g.lineTo(-r*0.10, r*0.16);
        g.moveTo( r*0.10, -r*0.16); g.lineTo( r*0.30, r*0.16);
        g.moveTo(-r*0.20, -r*0.22); g.lineTo(-r*0.04, r*0.20);
        g.moveTo( r*0.04, -r*0.22); g.lineTo( r*0.20, r*0.20);
        g.stroke();
      }
      g.beginPath(); g.arc(0, 0, r*0.14, 0, Math.PI*2); g.fill();
      g.restore();
    }

    // ---- 眼睛：平时圆眼带高光，吃到豆豆时眯成开心眼 ----
    const ex = r*0.33, ey = -r*0.10, er = r*0.265;
    if(eating && chomp > 0.5){
      g.strokeStyle = ink; g.lineWidth = lw;
      [-1,1].forEach(sx=>{
        g.beginPath();
        g.moveTo(sx*ex - er*0.88, ey + er*0.28);
        g.quadraticCurveTo(sx*ex, ey - er*1.05, sx*ex + er*0.88, ey + er*0.28);
        g.stroke();
      });
    } else {
      [-1,1].forEach(sx=>{
        const rr = er * (eating ? 1.12 : 1);
        g.fillStyle = ink;
        g.beginPath(); g.ellipse(sx*ex, ey, rr, rr*1.10, 0, 0, Math.PI*2); g.fill();
        g.fillStyle = '#fff';
        g.beginPath(); g.arc(sx*ex + rr*0.30, ey - rr*0.42, rr*0.44, 0, Math.PI*2); g.fill();   // 大眼睛高光
        g.fillStyle = 'rgba(255,255,255,.6)';
        g.beginPath(); g.arc(sx*ex - rr*0.36, ey + rr*0.44, rr*0.19, 0, Math.PI*2); g.fill();
        if(eating){
          g.fillStyle = '#fff';
          g.beginPath(); g.arc(sx*ex - rr*0.38, ey + rr*0.44, rr*0.24, 0, Math.PI*2); g.fill();
        }
      });
    }

    // ---- 鼻子 / 嘴 ----
    const my = r*0.32;
    if(eating){
      const open = r*(0.15 + 0.28*chomp);
      g.fillStyle = '#8c2a52';
      g.beginPath(); g.ellipse(0, my + open*0.32, r*0.25, open, 0, 0, Math.PI*2); g.fill();
      g.fillStyle = '#ff7fb2';
      g.beginPath(); g.ellipse(0, my + open*0.70, r*0.15, open*0.46, 0, 0, Math.PI*2); g.fill();
    } else if(sk.kind === 'bunny'){
      g.strokeStyle = ink; g.lineWidth = lw;                 // 米菲标志性的小 × 嘴
      const mw = r*0.11;
      g.beginPath();
      g.moveTo(-mw, my - mw); g.lineTo(mw, my + mw);
      g.moveTo(mw, my - mw); g.lineTo(-mw, my + mw);
      g.stroke();
    } else if(sk.kind === 'sheep'){
      g.fillStyle = sk.nose;                                 // 小羊：粉鼻子 + 弯弯的笑嘴
      g.beginPath(); g.ellipse(0, r*0.17, r*0.15, r*0.12, 0, 0, Math.PI*2); g.fill();
      g.strokeStyle = 'rgba(130,88,78,.7)'; g.lineWidth = Math.max(1.3, r*0.07);
      g.beginPath();
      g.moveTo(0, r*0.27);
      g.quadraticCurveTo(-r*0.15, r*0.45, -r*0.28, r*0.26);
      g.moveTo(0, r*0.27);
      g.quadraticCurveTo( r*0.15, r*0.45,  r*0.28, r*0.26);
      g.stroke();
    } else {
      g.fillStyle = sk.nose;                                 // Hello Kitty：彩鼻子 + 三根短胡须
      g.beginPath(); g.ellipse(0, my, r*0.14, r*0.11, 0, 0, Math.PI*2); g.fill();
      g.strokeStyle = sk.whk || 'rgba(226,85,155,.7)'; g.lineWidth = Math.max(1.1, r*0.055);
      [-1,1].forEach(sx=>{
        for(let k=-1;k<=1;k++){
          const y0 = -r*0.02 + k*r*0.15;
          g.beginPath();
          g.moveTo(sx*r*0.54, y0);
          g.lineTo(sx*r*0.98, y0 - r*0.07);
          g.stroke();
        }
      });
    }

    // ---- 腮红 ----
    const br = r*(0.16 + 0.06*chomp);
    g.fillStyle = sk.blush;
    [-1,1].forEach(sx=>{ g.beginPath(); g.arc(sx*r*0.62, r*0.28, br, 0, Math.PI*2); g.fill(); });
  }

  // 主循环
  function loop(ts){
    if(!lastTime) lastTime=ts;
    let dt = ts-lastTime; lastTime=ts;
    if(dt>100) dt=100;
    if(state==='playing'){
      if(invincibleT>0) invincibleT-=dt;
      if(speedT>0) speedT-=dt;
      if(eatT>0) eatT-=dt;
      if(doubleT>0){ doubleT-=dt; if(doubleT<=0) multiplier=1; }
      if(powerup){ powerup.life-=dt; if(powerup.life<=0) powerup=null; }
      // 定时补充道具，保证场上常有"豆子"
      powerTimer += dt;
      if(powerTimer >= 6000){ powerTimer = 0; maybeSpawnPowerup(); }
      const interval = speedT>0 ? moveInterval*0.55 : moveInterval;
      acc+=dt;
      while(acc>=interval){ acc-=interval; step(); if(state!=='playing') break; }
    }
    updateParticles(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // 输入：方向入队，支持快速连续转向
  function queueDir(x,y){
    if(state!=='playing') return;
    const last = dirQueue.length ? dirQueue[dirQueue.length-1] : dir;
    if(x===-last.x && y===-last.y) return; // 禁止 180° 反向
    if(x===last.x && y===last.y) return;   // 同向忽略
    if(dirQueue.length<3) dirQueue.push({x,y});
  }
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
    if(k==='arrowup'||k==='w') queueDir(0,-1);
    else if(k==='arrowdown'||k==='s') queueDir(0,1);
    else if(k==='arrowleft'||k==='a') queueDir(-1,0);
    else if(k==='arrowright'||k==='d') queueDir(1,0);
    else if(k===' '){ togglePause(); }
    else if(k==='enter'){ if(state!=='playing') startGame(); }
    else if(k==='r'){ startGame(); }
  });

  // 触屏：拖动即转向，更跟手（支持一次连续拖动画出 L 形）
  const SWIPE_MIN = 14;
  let tAnchor=null, tStart=null, tMoved=false;
  canvas.addEventListener('touchstart',e=>{
    tStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
    tAnchor={...tStart}; tMoved=false;
  },{passive:true});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(state!=='playing'||!tAnchor) return;
    const dx=e.touches[0].clientX-tAnchor.x, dy=e.touches[0].clientY-tAnchor.y;
    if(Math.hypot(dx,dy) < SWIPE_MIN) return;
    if(Math.abs(dx)>Math.abs(dy)) queueDir(dx>0?1:-1,0); else queueDir(0,dy>0?1:-1);
    tAnchor={x:e.touches[0].clientX,y:e.touches[0].clientY}; // 重置锚点，支持连续转向
    tMoved=true;
  },{passive:false});
  canvas.addEventListener('touchend',e=>{
    if(state==='playing' && !tMoved && tStart){
      const t=e.changedTouches[0];
      const dx=t.clientX-tStart.x, dy=t.clientY-tStart.y;
      if(Math.hypot(dx,dy)>=SWIPE_MIN){
        if(Math.abs(dx)>Math.abs(dy)) queueDir(dx>0?1:-1,0); else queueDir(0,dy>0?1:-1);
      }
    }
    tAnchor=tStart=null; tMoved=false;
  },{passive:true});

  function startGame(){
    reset();
    state='playing';
    el.overlay.classList.add('hidden');
    picker.classList.add('hidden');
    el.pauseBtn.textContent='暂停';
    if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  }
  function togglePause(){
    if(state==='playing'){ state='paused'; el.pauseBtn.textContent='继续';
      el.ovTitle.textContent='已暂停'; el.ovText.textContent='喘口气，准备好再继续。';
      el.startBtn.textContent='继续'; el.overlay.classList.remove('hidden'); }
    else if(state==='paused'){ state='playing'; lastTime=0;
      el.overlay.classList.add('hidden'); el.pauseBtn.textContent='暂停'; }
  }

  el.startBtn.addEventListener('click',()=>{
    if(state==='paused') togglePause(); else startGame();
  });
  el.pauseBtn.addEventListener('click',()=>{ if(state==='playing'||state==='paused') togglePause(); });
  el.restartBtn.addEventListener('click', startGame);
  el.themeBtn.addEventListener('click',()=>{
    const light = document.documentElement.getAttribute('data-theme')==='light';
    document.documentElement.setAttribute('data-theme', light?'dark':'light');
    el.themeBtn.textContent = light?'🌙':'☀️';
  });
  el.soundBtn.addEventListener('click',()=>{
    soundOn=!soundOn;
    el.soundBtn.textContent = soundOn?'🔊':'🔇';
    el.soundBtn.classList.toggle('off',!soundOn);
  });

  // 高分 & 初始
  el.high.textContent = highScore;
  renderCatPicker();
  reset(); state='menu';
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
